apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: headlamp-proxy-config
  namespace: kube-system
spec:
  kubernetes:
    service:
      externalTrafficPolicy: Cluster
      type: NodePort
      nodePorts:
      - listenerPort: 80
        port: 31009
      - listenerPort: 443
        port: 31010
    deployment:
      pod:
        tolerations:
          - effect: NoSchedule
            operator: Exists
            key: node-role.kubernetes.io/control-plane
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-gateway-fabric
                    app.kubernetes.io/component: nginx
                topologyKey: kubernetes.io/hostname

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: headlamp-gateway
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: headlamp-proxy-config
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.gpm.my.id"
  - name: https
    port: 443
    protocol: HTTPS
    hostname: "*.gpm.my.id"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: headlamp-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: kube-system
spec:
  parentRefs:
  - name: headlamp-gateway
    sectionName: http
  - name: headlamp-gateway
    sectionName: https
  hostnames:
  - "headlamp.k8s.gpm.my.id"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: headlamp
      port: 80